<html lang="en">
    <head>
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
              integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
              crossorigin=""/>
        <style>
            #map { height: 90vh; }
        </style>
        <title>Map - CoffeeBean</title>
    </head>
    <body>
    <div id="map">

    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>
    <script>
        let map;
        let lastlat;
        let lastlon;
        var markers = [];

        function distCoords(lat1, lon1, lat2, lon2) {
            const R = 6371e3; // metres
            const c1 = lat1 * Math.PI/180; // φ, λ in radians
            const c2 = lat2 * Math.PI/180;
            const dc = (lat2-lat1) * Math.PI/180;
            const dl = (lon2-lon1) * Math.PI/180;

            const a = Math.sin(dc/2) * Math.sin(dc/2) +
                Math.cos(c1) * Math.cos(c2) *
                Math.sin(dl/2) * Math.sin(dl/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));

            const d = R * c; //in metres
            return d/1609; // in miles
        }

        function onMapClick(e) {
            var popup = L.popup();
            popup
                .setLatLng(e.latlng)
                .setContent("<a href='{{url_for('add_shop')}}?lat="+e.latlng.lat+"&lon="+e.latlng.lng+"'>Add new shop here</a>")
                .openOn(map);
        }

        function markerPlace(res, curlat, curlon) {
                console.log(res);
                let dist
                let lat = res[1].lat
                let lon = res[1].lon

                if (curlat != null && curlon != null) {
                    dist = distCoords(curlat, curlon, lat, lon)
                } else {
                    dist = res[0];
                }
                let name = res[1].name;
                let id = res[1].id
                var found = false;
                //i would not do this if it weren't for the fact i tried every other way i could think of and it gave me issues
                markers.forEach(oldmarker => {
                    let mlat = oldmarker.getLatLng().lat
                    let mlon = oldmarker.getLatLng().lng
                    if (mlat == lat && mlon == lon) {
                        found = true;
                    }
                })
                if (!found) {
                    var marker = L.marker([lat, lon]).addTo(map);
                    marker.bindPopup("<b>" + name + "</b><br>Distance: " + dist.toFixed(1) + " miles<br><a href='{{ url_for('shops') }}?shopID=" + id + "'>View shop</a>");
                    markers.push(marker)
                }
        }

        function updateMap(e) {
            centerLat = map.getBounds().getCenter().lat
            centerLon = map.getBounds().getCenter().lng
            boundLat = map.getBounds().getNorthEast().lat
            boundLon = map.getBounds().getNorthEast().lng
            distance = distCoords(centerLat, centerLon, boundLat, boundLon)

            urlString = "{{ url_for('location_fetch') }}" + "?lat=" + centerLat + "&lon=" + centerLon + "&maxDist=" + Math.trunc(distance)
            fetchLocations(urlString).then(function (res) {

                if ("geolocation" in navigator) {

                    navigator.geolocation.getCurrentPosition(function(pos) {
                        let curlat = pos.coords.latitude;
                        let curlon = pos.coords.longitude;
                        for (let i = 0; i < res.length; i++) {
                            markerPlace(res[i], curlat, curlon);
                        }
                    }, function () {
                        for (let i = 0; i < res.length; i++) {
                            markerPlace(res[i], null, null);
                        }
                    })
                }
            })
        }

        async function fetchLocations(url) {
            const resp = await fetch(url);
            if (resp.ok) {
                return resp.json();
            } else {
                return -1;
            }
        }

        window.onload = function() {
            lastlat = 47.12170928392314;
            lastlon = -88.56322646141052;
            map = L.map('map').setView([47.12170928392314, -88.56322646141052], 15);
            map.on('click', onMapClick);
            L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
            }).addTo(map);

            if ("geolocation" in navigator) {

                map.locate({
                    setView:true,
                    maxZoom: 15
                })

            }

            updateMap();
            map.on('zoomend', updateMap);
            map.on('moveend', updateMap);


        }
    </script>
    </body>
</html>
