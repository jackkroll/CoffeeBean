<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - CoffeeBean</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #78350f 0%, #d97706 100%);
            position: relative;
            overflow: hidden;
        }
    </style>
</head>
<body class="min-h-screen">
    
    {% include "header.html" %}
    
    <div class ="flex items-center justify-center p-4">

    <div class="w-full max-w-md" style="position: relative; z-index: 1;">
        <!-- Signup Card -->
        <div class="bg-white rounded-2xl shadow-2xl p-8">
            <div class="mb-6">
                <h2 class="text-2xl font-bold text-gray-800 mb-2">Create Account</h2>
                <p class="text-gray-600">Join CoffeeBean to post reviews and discover great coffee!</p>
            </div>

            <!-- Error Message -->
            {% if error %}
            <div class="mb-4 p-4 bg-red-50 border border-red-200 rounded-lg">
                <p class="text-red-600 text-sm font-medium">{{ error }}</p>
            </div>
            {% endif %}

            <form action="/create-account" method="POST" class="space-y-5">
                {% if returnTo is not none %}
                <input type="hidden" name="returnTo" value="{{returnTo}}">
                {% endif %}

                <!-- Username Field -->
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-2">
                        Username
                    </label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-transparent transition duration-200 outline-none"
                        placeholder="Choose a username"
                    >
                </div>

                <!-- Email Field -->
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                        Email Address
                    </label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-transparent transition duration-200 outline-none"
                        placeholder="your.email@example.com"
                    >
                </div>

                <!-- Password Field -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                        Password
                    </label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-amber-500 focus:border-transparent transition duration-200 outline-none"
                        placeholder="Create a secure password"
                    >
                    <p class="mt-1 text-xs text-gray-500">Must be at least 6 characters and include a special character</p>
                </div>

                <!-- Submit Button -->
                <button
                    type="submit"
                    class="inline-block w-full px-6 py-3 bg-amber-700 hover:bg-amber-800 text-white font-bold rounded-lg transition-colors shadow-lg hover:shadow-xl"
                >
                    Create Account
                </button>
            </form>

            <!-- Login Link -->
            <div class="mt-6 text-center">
                <p class="text-gray-600">
                    Already have an account?
                    <a href="/login" class="text-amber-700 hover:text-amber-900 font-semibold hover:underline">
                        Log in
                    </a>
                </p>
            </div>
        </div>
    </div>
    </div>
</body>
</html>
